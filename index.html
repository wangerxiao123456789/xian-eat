<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#221F1B">
<meta name="description" content="西安交大周边吃什么？按餐段、预算、场合、距离筛选，抽签帮你决定。">
<title>今天吃啥 · 交大周边</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>🍜</text></svg>">
<style>
:root{
  --bg:#FBF7F2; --ink:#221F1B; --ink2:#6E655B; --ink3:#9C9086;
  --line:#EAE1D5; --line2:#F2EBE1;
  --red:#C8442B; --amber:#E8A33D; --green:#3F7A57;
  --card:#FFFFFF;
  --serif:'Songti SC','STSong','SimSun','Noto Serif SC',serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--ink);min-height:100vh;
  padding:18px 14px 48px;line-height:1.6;
  background-image:radial-gradient(circle at 12% 8%,#F6EDE2 0,transparent 42%),radial-gradient(circle at 88% 4%,#F7EFE4 0,transparent 38%);
  background-attachment:fixed;
}
.wrap{max-width:780px;margin:0 auto}

/* ---------- 招牌 ---------- */
.hero{
  background:linear-gradient(158deg,#2C2723,#1B1815);
  border-radius:16px;padding:24px 20px 22px;color:#F7F1E8;
  box-shadow:0 10px 30px rgba(34,31,27,.18);margin-bottom:16px;
}
.brand{font-family:var(--serif);font-size:2.1em;font-weight:700;letter-spacing:.14em;line-height:1.15}
.brandsub{font-size:.76em;color:#B9AE9F;letter-spacing:.06em;margin-top:6px}
.brandsub b{color:var(--amber);font-weight:700}
.rule{height:1px;background:linear-gradient(90deg,transparent,#6B6157,transparent);margin:16px 0}
.win{
  background:#FDF8F0;border:2px solid var(--red);border-radius:10px;padding:16px 12px;
  min-height:82px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;box-shadow:inset 0 2px 6px rgba(0,0,0,.06)
}
.win .wn{font-family:var(--serif);font-size:1.4em;font-weight:700;color:var(--red);line-height:1.3}
.win .wm{font-size:.74em;color:#8B8073;margin-top:5px;letter-spacing:.03em}
.win.spin{animation:sp .1s linear infinite}
@keyframes sp{0%{transform:translateY(0)}50%{transform:translateY(-3px)}100%{transform:translateY(0)}}
.btn{
  display:block;width:100%;margin-top:14px;background:var(--red);color:#fff;border:none;
  padding:14px;font-size:1.02em;font-weight:700;letter-spacing:.1em;border-radius:999px;cursor:pointer;
  box-shadow:0 4px 14px rgba(200,68,43,.32);transition:.18s;font-family:inherit
}
.btn:hover{background:#B33A24;transform:translateY(-1px)}
.btn:disabled{background:#7C7267;box-shadow:none;cursor:not-allowed;transform:none}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.gh{background:transparent;border:1px solid #6B6157;color:#E4D9C9;border-radius:999px;
  padding:8px 16px;font-size:.8em;cursor:pointer;letter-spacing:.05em;font-family:inherit}
.gh:hover{background:rgba(255,255,255,.07)}

/* ---------- 结果 ---------- */
.res{display:none;margin-top:14px;background:#FFFDF8;border:1px solid var(--line);
  border-left:3px solid var(--red);border-radius:10px;padding:14px 16px}
.resT{font-size:.7em;letter-spacing:.24em;color:var(--ink3)}
.resN{font-family:var(--serif);font-size:1.35em;font-weight:700;margin:2px 0 4px}
.resM{font-size:.8em;color:var(--ink2)}
.resC{font-size:.82em;color:var(--ink);margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
.resA{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.resA button{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 13px;
  font-size:.76em;cursor:pointer;color:var(--ink2);font-family:inherit}
.resA button:hover{border-color:var(--red);color:var(--red)}

/* ---------- 卡片 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.sec{font-family:var(--serif);font-size:1.05em;font-weight:700;letter-spacing:.08em;margin-bottom:4px}
.sec small{font-family:inherit;font-size:.66em;font-weight:400;color:var(--ink3);letter-spacing:0;margin-left:6px}
.hint{font-size:.74em;color:var(--ink3);margin-bottom:12px}

/* 场合 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.tile{border:1px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer;transition:.15s;background:#FDFBF8}
.tile:hover{border-color:var(--red)}
.tile .t1{font-size:.88em;font-weight:700}
.tile .t2{font-size:.7em;color:var(--ink3);margin-top:2px}
.tile.on{background:var(--ink);border-color:var(--ink)}
.tile.on .t1{color:#F7F1E8}
.tile.on .t2{color:#9C9086}

/* 筛选行 */
.frow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line2)}
.frow:first-of-type{border-top:none}
.fl{font-size:.76em;color:var(--ink3);width:44px;flex:none;padding-top:5px;letter-spacing:.08em}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.chip{border:1px solid var(--line);background:#FDFBF8;border-radius:999px;padding:5px 11px;
  font-size:.78em;cursor:pointer;user-select:none;transition:.14s}
.chip:hover{border-color:var(--red)}
.chip.on{background:var(--red);color:#fff;border-color:var(--red)}
.swt{display:flex;align-items:center;gap:7px;font-size:.78em;color:var(--ink2);cursor:pointer;padding:5px 0}
.swt input{width:15px;height:15px;accent-color:var(--red)}
.swts{display:flex;flex-wrap:wrap;gap:0 18px;padding-top:8px;border-top:1px solid var(--line2);margin-top:4px}
.reset{margin-top:12px}

.count{text-align:center;font-size:.78em;color:var(--ink2);margin:2px 0 14px;letter-spacing:.04em}
.count b{font-family:var(--serif);font-size:1.5em;color:var(--red);margin:0 2px}

/* 列表 */
.tabs{display:flex;gap:6px;margin-bottom:11px;flex-wrap:wrap}
.tab{padding:5px 12px;border-radius:999px;border:1px solid var(--line);font-size:.78em;cursor:pointer;background:#FDFBF8}
.tab.on{background:var(--ink);color:#F7F1E8;border-color:var(--ink)}
.search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;
  font-size:.85em;margin-bottom:9px;outline:none;background:#FDFBF8;font-family:inherit}
.search:focus{border-color:var(--red);background:#fff}
.sort{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px;align-items:center}
.sort i{font-style:normal;font-size:.72em;color:var(--ink3);margin-right:2px}
.sort span{font-size:.76em;padding:3px 10px;border-radius:999px;border:1px solid var(--line);cursor:pointer;color:var(--ink2)}
.sort span.on{background:var(--ink);color:#F7F1E8;border-color:var(--ink)}

.item{border:1px solid var(--line2);border-radius:11px;padding:12px 13px;margin-bottom:8px;cursor:pointer;background:#fff;transition:.14s}
.item:hover{border-color:#D8C9B6}
.ihead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.iname{font-family:var(--serif);font-size:1em;font-weight:700;flex:1}
.iprice{color:var(--red);font-weight:700;font-size:.9em;white-space:nowrap;font-variant-numeric:tabular-nums}
.imeta{font-size:.72em;color:var(--ink2);margin-top:6px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tag{padding:2px 7px;border-radius:5px;background:#F4EFE8;color:#72685C;font-size:.95em}
.tag.cat{background:#FBEDE9;color:var(--red);font-weight:600}
.tag.good{background:#EAF3EE;color:var(--green)}
.tag.z{background:#EEF2F6;color:#4A6076}
.tag.s{background:#F7F0E4;color:#8A6A2F}
.tag.buf{background:#FDEFE6;color:#B4622A;font-weight:600}
.addr{color:var(--ink3)}
.icm{font-size:.8em;color:#5F564C;margin-top:9px;display:none;border-top:1px dashed var(--line);padding-top:9px}
.icm p{margin-bottom:5px;padding-left:14px;position:relative}
.icm p::before{content:'—';position:absolute;left:0;color:var(--ink3)}
.item.open .icm{display:block}
.iacts{display:flex;gap:6px;margin-top:9px}
.iacts button{border:1px solid var(--line);background:#FDFBF8;border-radius:999px;padding:5px 11px;
  font-size:.72em;cursor:pointer;color:var(--ink2);font-family:inherit}
.iacts button:hover{border-color:var(--red);color:var(--red)}
.iacts button.on{background:#FBEDE9;border-color:#EFBDB2;color:var(--red)}
.iacts button.fav.on{background:#FBF1DE;border-color:#E8C88E;color:#8A6A2F}
.iacts button.go.on{background:#EAF3EE;border-color:#B6D6C3;color:var(--green)}

.foot{text-align:center;font-size:.74em;color:var(--ink3);line-height:1.9;padding:6px 8px}
.foot a{color:var(--ink2);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:1px;word-break:break-all}
.foot a:active{color:var(--red);border-bottom-color:var(--red)}
.empty{text-align:center;color:var(--ink3);font-size:.82em;padding:22px 0}
@media(max-width:420px){
  .brand{font-size:1.75em}
  .grid{grid-template-columns:repeat(2,1fr)}
  .fl{width:38px}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div class="brand">今天吃啥</div>
    <div class="brandsub">西安交大周边 · <b id="total">0</b> 家店 · 好评 <b id="redn">0</b> 家</div>
    <div class="rule"></div>
    <div class="win" id="win">
      <div class="wn" id="wn">备好条件</div>
      <div class="wm" id="wm">点下面按钮开抽</div>
    </div>
    <button class="btn" id="spinBtn" onclick="spin()">帮我决定</button>
    <div class="row" id="resActs" style="display:none">
      <button class="gh" onclick="spin()">换一个</button>
      <button class="gh" onclick="copyRes()">复制结果</button>
      <button class="gh" id="favBtn" onclick="toggleFav()">收藏</button>
    </div>
    <div class="res" id="res"></div>
  </header>

  <section class="card">
    <div class="sec">什么场合<small>不选＝全部</small></div>
    <div class="hint">聚餐、约会，还是一个人随便对付一口</div>
    <div class="grid" id="sceneChips"></div>
  </section>

  <section class="card">
    <div class="sec">细挑一下</div>
    <div class="hint">条件越窄，抽到的越合心意</div>
    <div class="frow"><div class="fl">餐段</div><div class="chips" id="mealChips"></div></div>
    <div class="frow"><div class="fl">预算</div><div class="chips" id="budgetChips"></div></div>
    <div class="frow"><div class="fl">品类</div><div class="chips" id="catChips"></div></div>
    <div class="frow"><div class="fl">距离</div><div class="chips" id="zoneChips"></div></div>
    <div class="frow"><div class="fl">口碑</div><div class="chips" id="qualChips"></div></div>
    <div class="swts">
      <label class="swt"><input type="checkbox" id="onlyBuf"> 只看自助</label>
      <label class="swt"><input type="checkbox" id="hideGone"> 排除我吃过的</label>
      <label class="swt"><input type="checkbox" id="showClosed"> 显示已歇业</label>
    </div>
    <div class="reset"><button class="gh" style="border-color:var(--line);color:var(--ink2)" onclick="resetAll()">重置全部条件</button></div>
  </section>

  <div class="count" id="count"></div>

  <section class="card">
    <div class="tabs" id="tabs"></div>
    <input class="search" id="search" placeholder="搜店名 / 地段 / 口味关键词" oninput="renderList()">
    <div class="sort" id="sort"></div>
    <div id="list"></div>
  </section>

  <div class="foot">
    有店关门 / 新店推荐 / 价格有出入，欢迎邮件反馈<br>
    <a id="mlink" href="#">邮箱载入中…</a><br>
    <span style="opacity:.8">—— by 青100色</span>
  </div>
</div>

const CAT_META = {
  '中餐':['🍚','#FBEDE9'],'火锅':['🍲','#FBEDE9'],'烧烤':['🍢','#FBEEE2'],
  '面食小吃':['🍜','#F3F0E6'],'日料':['🍣','#EEF2F6'],'西餐':['🍕','#EEF2F6'],
  '甜品':['🍰','#F7EEF4']
};
const CATS = Object.keys(CAT_META);
const MEALS = ['午餐','晚餐'];
const SCENES = [
  ['一人食','一个人也能吃'],['日常便饭','食堂吃腻了'],['朋友小聚','两三个人'],
  ['团建聚餐','人多大桌'],['情侣约会','环境要好点'],
  ['商务宴请','请老师/领导','人均180+'],['带外地同学','陕味和特色']
];
const ZONES = [['walk','出校门就到'],['metro','地铁短途'],['far','专程去']];
const BUDGETS = [[0,30,'≤30 吃饱'],[30,80,'30–80 正常'],[80,9999,'80+ 下血本']];
const QUALS = [[1,'大家夸过'],[0,'待判断'],[-2,'无评价']];

const F = {scene:new Set(), meal:new Set(), cat:new Set(), zone:new Set(), qual:new Set([1,0]),
           budget:null, onlyBuf:false, hideGone:false, showClosed:false};
let tab='all', sortBy='smart', cur=null;

const LS = {
  fav:new Set(JSON.parse(localStorage.getItem('eat_fav')||'[]')),
  gone:new Set(JSON.parse(localStorage.getItem('eat_gone')||'[]')),
  black:new Set(JSON.parse(localStorage.getItem('eat_black')||'[]'))
};
const saveLS=()=>{localStorage.setItem('eat_fav',JSON.stringify([...LS.fav]));
  localStorage.setItem('eat_gone',JSON.stringify([...LS.gone]));
  localStorage.setItem('eat_black',JSON.stringify([...LS.black]));};

(function(){ const h=new Date().getHours();
  F.meal.add(h<14?'午餐':'晚餐'); })();

function mkChips(el, items, set){
  el.innerHTML='';
  items.forEach(([val,label])=>{
    const d=document.createElement('div');
    d.className='chip'+(set.has(val)?' on':''); d.textContent=label;
    d.onclick=()=>{ set.has(val)?set.delete(val):set.add(val);
      [...el.children].forEach((c,i)=>c.classList.toggle('on', set.has(items[i][0]))); apply(); };
    el.appendChild(d);
  });
}
function buildChips(){
  const sc=document.getElementById('sceneChips'); sc.innerHTML='';
  SCENES.forEach(([k,d])=>{
    const t=document.createElement('div');
    t.className='tile'+(F.scene.has(k)?' on':'');
    t.innerHTML=`<div class="t1">${k}</div><div class="t2">${d}</div>`;
    t.onclick=()=>{ F.scene.has(k)?F.scene.delete(k):F.scene.add(k); buildChips(); apply(); };
    sc.appendChild(t);
  });
  mkChips(document.getElementById('mealChips'), MEALS.map(s=>[s,s]), F.meal);
  mkChips(document.getElementById('catChips'), CATS.map(c=>[c,(CAT_META[c]||['',''])[0]+' '+c]), F.cat);
  mkChips(document.getElementById('zoneChips'), ZONES, F.zone);
  mkChips(document.getElementById('qualChips'), QUALS, F.qual);
  const bel=document.getElementById('budgetChips');
  bel.innerHTML='';
  BUDGETS.forEach((b,i)=>{
    const d=document.createElement('div'); d.className='chip'; d.textContent=b[2];
    const on = F.budget && F.budget[0]===b[0];
    if(on) d.classList.add('on');
    d.onclick=()=>{ F.budget = on ? null : [b[0],b[1]];
      [...bel.children].forEach((x,j)=>x.classList.toggle('on', !on && j===i)); apply(); };
    bel.appendChild(d);
  });
}
function resetAll(){
  F.scene.clear(); F.meal.clear(); F.cat.clear(); F.zone.clear(); F.budget=null;
  F.qual=new Set([1,0]); F.onlyBuf=false; F.hideGone=false; F.showClosed=false;
  ['onlyBuf','hideGone','showClosed'].forEach(id=>document.getElementById(id).checked=false);
  buildChips(); apply();
}
['onlyBuf','hideGone','showClosed'].forEach(id=>{
  document.getElementById(id).onchange=e=>{ F[id]=e.target.checked; apply(); };
});

function qualOf(s){ return s.u ? -2 : s.v; }
function match(s){
  if(!F.showClosed && !s.on) return false;
  if(LS.black.has(s.n)) return false;
  if(F.hideGone && LS.gone.has(s.n)) return false;
  if(!F.qual.has(qualOf(s))) return false;
  if(F.onlyBuf && !s.buf) return false;
  if(F.cat.size && !F.cat.has(s.c)) return false;
  if(F.meal.size && !s.m.some(x=>F.meal.has(x))) return false;
  if(F.scene.size && !s.s.some(x=>F.scene.has(x))) return false;
  if(F.zone.size && !F.zone.has(s.z)) return false;
  if(F.budget){ if(s.lo==null) return false;
    const [lo,hi]=F.budget; if(s.hi<lo||s.lo>hi) return false; }
  return true;
}
let pool=[];
function apply(){
  pool = SHOPS.filter(match);
  const good = pool.filter(s=>s.v===1).length;
  document.getElementById('count').innerHTML = pool.length
    ? `可抽 <b>${pool.length}</b> 家${good?` · 其中好评 ${good} 家`:''}`
    : `没有符合条件的店，放宽一点试试`;
  document.getElementById('total').textContent = SHOPS.length;
  document.getElementById('redn').textContent = SHOPS.filter(s=>s.v===1).length;
  document.getElementById('spinBtn').disabled = pool.length===0;
  renderList();
}

let spinning=false;
function spin(){
  if(spinning||!pool.length) return;
  spinning=true;
  const btn=document.getElementById('spinBtn'), win=document.getElementById('win');
  const wn=document.getElementById('wn'), wm=document.getElementById('wm');
  btn.disabled=true; btn.textContent='挑选中…';
  win.classList.add('spin');
  document.getElementById('res').style.display='none';
  document.getElementById('resActs').style.display='none';
  let i=0;
  const t=setInterval(()=>{
    wn.textContent = pool[Math.floor(Math.random()*pool.length)].n;
    wm.textContent='';
    if(++i>16){
      clearInterval(t); win.classList.remove('spin');
      cur = pool[Math.floor(Math.random()*pool.length)];
      showRes(cur);
      btn.disabled=false; btn.textContent='再抽一次'; spinning=false;
    }
  },85);
}
const pTxt=s=> s.lo==null?'人均待补':(s.lo===s.hi?`人均 ¥${s.lo}`:`人均 ¥${s.lo}–${s.hi}`);
const zTxt=s=> s.z==='walk'?'出校门就到':s.z==='metro'?'地铁短途':'专程去';
function showRes(s){
  document.getElementById('wn').textContent = s.n;
  document.getElementById('wm').textContent = `${s.c} · ${pTxt(s)} · ${s.d}`;
  const r=document.getElementById('res');
  r.innerHTML=`
    <div class="resT">今天就吃</div>
    <div class="resN">${s.n}</div>
    <div class="resM">${(CAT_META[s.c]||['',''])[0]} ${s.c} · ${pTxt(s)}${s.buf?' · 自助':''}</div>
    <div class="resM" style="margin-top:4px">📍 ${s.d}${s.a?'　'+s.a:''}</div>
    ${s.s.length?`<div class="resM" style="margin-top:4px">${s.s.map(x=>'#'+x).join(' ')}</div>`:''}
    ${s.cm.length?`<div class="resC">${s.cm[0]}</div>`:''}
    <div class="resA">
      <button onclick="markGone()">我去了</button>
      <button onclick="markBlack()">避雷</button>
      <button onclick="spin()">换一个</button>
    </div>`;
  r.style.display='block';
  document.getElementById('resActs').style.display='flex';
  document.getElementById('favBtn').textContent = LS.fav.has(s.n)?'已收藏':'收藏';
  r.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function markGone(){ if(cur){LS.gone.add(cur.n);saveLS();apply();toast('记下了：'+cur.n);} }
function markBlack(){ if(cur){LS.black.add(cur.n);LS.fav.delete(cur.n);saveLS();apply();toast('已拉黑：'+cur.n);} }
function toggleFav(){ if(!cur)return; LS.fav.has(cur.n)?LS.fav.delete(cur.n):LS.fav.add(cur.n); saveLS();
  document.getElementById('favBtn').textContent=LS.fav.has(cur.n)?'已收藏':'收藏'; renderList(); }
function copyRes(){ if(!cur)return;
  const t=`今天吃：${cur.n}｜${pTxt(cur)}｜${cur.a||cur.d}`;
  navigator.clipboard?.writeText(t).then(()=>toast('已复制，去群里喊人'),()=>toast(t)); }
function toast(msg){ const d=document.createElement('div'); d.textContent=msg;
  d.style.cssText='position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:rgba(34,31,27,.92);color:#F7F1E8;padding:9px 18px;border-radius:999px;font-size:.82em;z-index:99;max-width:88%;text-align:center';
  document.body.appendChild(d); setTimeout(()=>d.remove(),1800); }

const TABS=[['all','全部'],['good','好评'],['fav','收藏'],['mine','我的避雷']];
function buildTabs(){ const el=document.getElementById('tabs'); el.innerHTML='';
  TABS.forEach(([k,l])=>{ const d=document.createElement('div');
    d.className='tab'+(tab===k?' on':''); d.textContent=l;
    d.onclick=()=>{tab=k;buildTabs();renderList();}; el.appendChild(d); }); }
function buildSort(){ const el=document.getElementById('sort');
  const opts=[['smart','综合'],['price','人均↑'],['priceDesc','人均↓'],['zone','距离近']];
  el.innerHTML='<i>排序</i>';
  opts.forEach(([k,l])=>{ const s=document.createElement('span');
    s.className=sortBy===k?'on':''; s.textContent=l;
    s.onclick=()=>{sortBy=k;buildSort();renderList();}; el.appendChild(s); }); }
function listPool(){
  let p=pool.slice();
  const q=document.getElementById('search').value.trim();
  if(q) p=p.filter(s=>(s.n+s.a+s.d+s.c+s.cm.join('')).includes(q));
  if(tab==='good') p=p.filter(s=>s.v===1&&!s.u);
  if(tab==='fav') p=p.filter(s=>LS.fav.has(s.n));
  if(tab==='mine') p=SHOPS.filter(s=>LS.black.has(s.n));
  const zi={walk:0,metro:1,far:2};
  if(sortBy==='price') p.sort((a,b)=>(a.lo??9999)-(b.lo??9999));
  else if(sortBy==='priceDesc') p.sort((a,b)=>(b.lo??0)-(a.lo??0));
  else if(sortBy==='zone') p.sort((a,b)=>zi[a.z]-zi[b.z]);
  else p.sort((a,b)=>(b.v-a.v)||(zi[a.z]-zi[b.z])||((a.lo??999)-(b.lo??999)));
  return p;
}
function renderList(){
  const el=document.getElementById('list'); const p=listPool();
  if(!p.length){ el.innerHTML='<div class="empty">没有匹配的店</div>'; return; }
  el.innerHTML=p.slice(0,150).map(s=>`
    <div class="item" onclick="this.classList.toggle('open')">
      <div class="ihead">
        <div class="iname">${s.n}</div>
        <div class="iprice">${s.lo==null?'—':(s.lo===s.hi?'¥'+s.lo:'¥'+s.lo+'-'+s.hi)}</div>
      </div>
      <div class="imeta">
        <span class="tag cat">${(CAT_META[s.c]||['',''])[0]} ${s.c}</span>
        ${s.buf?'<span class="tag buf">自助</span>':''}
        ${s.v===1?'<span class="tag good">好评</span>':''}
        <span class="tag z">${s.d}</span>
        ${s.s.slice(0,3).map(x=>`<span class="tag s">${x}</span>`).join('')}
      </div>
      ${s.a?`<div class="imeta"><span class="addr">📍 ${s.a}</span></div>`:''}
      ${s.cm.length?`<div class="icm">${s.cm.map(c=>`<p>${c}</p>`).join('')}</div>`:''}
      <div class="iacts">
        <button class="fav${LS.fav.has(s.n)?' on':''}" onclick="event.stopPropagation();tf('${s.n.replace(/'/g,'')}')">${LS.fav.has(s.n)?'已收藏':'收藏'}</button>
        <button class="go${LS.gone.has(s.n)?' on':''}" onclick="event.stopPropagation();tg('${s.n.replace(/'/g,'')}')">${LS.gone.has(s.n)?'去过了':'去过'}</button>
        <button class="${LS.black.has(s.n)?' on':''}" onclick="event.stopPropagation();tb('${s.n.replace(/'/g,'')}')">避雷</button>
      </div>
    </div>`).join('')+(p.length>150?`<div class="empty">还有 ${p.length-150} 家，缩小范围看</div>`:'');
}
function tf(n){LS.fav.has(n)?LS.fav.delete(n):LS.fav.add(n);saveLS();renderList();}
function tg(n){LS.gone.has(n)?LS.gone.delete(n):LS.gone.add(n);saveLS();renderList();}
function tb(n){LS.black.has(n)?LS.black.delete(n):LS.black.add(n);saveLS();apply();renderList();}

buildChips(); buildTabs(); buildSort(); apply();
